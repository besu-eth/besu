apply plugin: 'java-library'

// override the path-derived name (besu-crypto-plugin-api) with the plugin API family naming
def securityApiArtifactId = 'besu-plugin-api-security'

jar {
  archiveBaseName = securityApiArtifactId
  manifest {
    attributes(
      'Specification-Title': archiveBaseName,
      'Specification-Version': project.version,
      'Implementation-Title': archiveBaseName,
      'Implementation-Version': calculateVersion(),
      'Commit-Hash': getGitCommitDetails(40).hash,
      'Automatic-Module-Name': 'org.hyperledger.besu.plugin.api.security'
      )
  }
}

dependencies {
  api project(':plugin-api:core')
  // Bytes/Bytes32 appear in SecurityModule's own signatures, so the dependency is declared
  // here even though plugin-api:core also re-exports it
  api 'io.consensys.tuweni:tuweni-bytes'
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      groupId = 'org.hyperledger.besu'
      artifactId = securityApiArtifactId
      pom {
        name = 'Besu Plugin API Security'
        description = 'Security module contracts of the Besu plugin API, covering the security module service, the signer SPI and its public key and signature data interfaces'
      }
    }
  }
}
