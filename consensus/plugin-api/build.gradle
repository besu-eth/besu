apply plugin: 'java-library'

// override the path-derived name (besu-consensus-plugin-api) with the plugin API family naming
def consensusApiArtifactId = 'besu-plugin-api-consensus'

jar {
  archiveBaseName = consensusApiArtifactId
  manifest {
    attributes(
      'Specification-Title': archiveBaseName,
      'Specification-Version': project.version,
      'Implementation-Title': archiveBaseName,
      'Implementation-Version': calculateVersion(),
      'Commit-Hash': getGitCommitDetails(40).hash,
      'Automatic-Module-Name': 'org.hyperledger.besu.plugin.api.consensus'
      )
  }
}

dependencies {
  api project(':plugin-api:core')
  // Address appears in this module's own signatures, so the dependency
  // is declared here even though plugin-api:core also re-exports it
  api project(':datatypes')
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      groupId = 'org.hyperledger.besu'
      artifactId = consensusApiArtifactId
      pom {
        name = 'Besu Plugin API Consensus'
        description = 'Proof-of-authority and BFT query contracts of the Besu plugin API, letting plugins read the validator set at the chain head, the proposer, round number and commit signers of a block, and this node\'s own signer address'
      }
    }
  }
}
