plugins {
    id 'net.consensys.besu-plugin-distribution' version '0.2.0'
}

group = 'org.hyperledger.besu.tests'
version = besuVersion
besuPlugin {
    besuVersion = version
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // this is just to force that dependency to be present in the plugin distribution
    // so we can create an ad-hoc conflict with the other plugin.
    // Besu's own BOM also manages junit, so pin strictly to stop Gradle's normal
    // highest-version-wins resolution from aligning both plugins on the BOM's version.
    runtimeOnly('org.junit.jupiter:junit-jupiter-api') {
        version { strictly '5.14.2' }
    }
    runtimeOnly('org.junit.platform:junit-platform-commons') {
        version { strictly '1.14.2' }
    }
}

jar {
    archiveFileName = 'dependencyConflict1.jar'
    manifest {
        attributes(
                'Specification-Title': archiveBaseName,
                'Specification-Version': project.version,
                'Implementation-Title': archiveBaseName,
                'Implementation-Version': project.version
        )
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = ''
    archiveBaseName = 'dependencyConflictPlugin2'
}