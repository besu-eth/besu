# SPDX-License-Identifier: Apache-2.0
name: devnet-tests

on:
  workflow_call:

env:
  GRADLE_OPTS: "-Xmx6g -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

permissions:
  actions: read
  contents: read

jobs:
  devnetTests:
    runs-on: besu-research-ubuntu-8 # the devnet fixtures need the extra disk space
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        task: [consumeEngineTestsGlamsterdam, consumeRlpTestsGlamsterdam]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
        with:
          cache-disabled: true
      - name: Run ${{ matrix.task }}
        run: ./gradlew :ethereum:evmtool:${{ matrix.task }}

  devnetTestsPassed:
    name: devnetTestsPassed
    runs-on: ubuntu-latest
    needs: [devnetTests]
    permissions:
      contents: read
    if: always()
    steps:
      - name: Fail on workflow error
        run: exit 1
        if: >-
          ${{
            contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
            || contains(needs.*.result, 'skipped')
          }}
