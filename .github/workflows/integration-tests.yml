# SPDX-License-Identifier: Apache-2.0
name: integration-tests

on:
  workflow_call:

env:
  GRADLE_OPTS: "-Xmx6g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

permissions:
  actions: read
  contents: read

jobs:
  integrationTests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        env:
          # Restore the build job's entry, not an older one saved by this job
          GRADLE_BUILD_ACTION_CACHE_KEY_JOB: build
        with:
          cache-read-only: true # only the build job in ci.yml writes the Gradle cache
      - name: Run integration tests and compile JMH benchmarks
        run: ./gradlew integrationTest compileJmh

  integrationTestsPassed:
    name: integrationTestsPassed
    runs-on: ubuntu-latest
    needs: [integrationTests]
    permissions:
      contents: read
    if: always()
    steps:
      - name: Fail on workflow error
        run: exit 1
        if: >-
          ${{
            contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
            || contains(needs.*.result, 'skipped')
          }}
