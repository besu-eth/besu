name: allowed-actions

# A workflow that uses an action missing from the repository's allowlist fails to start, with no
# hint of which action is missing. This check lives in its own workflow, using only long-allowed
# actions, so that it still runs and names the action when another workflow can't start.
on:
  pull_request:
    paths:
      - '.github/**'
  push:
    branches:
      - main
    paths:
      - '.github/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check actions are in .github/allowed-actions.txt
        run: .github/scripts/check-allowed-actions.sh
