name: CI
# manual runs are named after their checks, so that their results can be told apart
run-name: ${{ github.event_name == 'workflow_dispatch' && format('CI ({0})', inputs.checks) || '' }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - release*
      - performance
      - '*-devnet-*'
      - plugin-api-refactor
      - 'rebase/**'
  # manual runs on any branch
  workflow_dispatch:
    inputs:
      checks:
        description: 'fast: build and unit tests; full: every suite'
        type: choice
        options:
          - full
          - fast
        default: full

# Manual runs each validate a specific commit, so every one gets a group of its own and is never
# cancelled. Pull requests and pushes to main keep the usual behaviour: only the latest commit is
# relevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Xmx6g -Dorg.gradle.parallel=true"

# Default for the jobs below that declare no permissions of their own; the reusable-workflow
# callers each narrow this further.
permissions:
  contents: read

# Job matrix:
#
#   push to main:      [testScope, gradleWrapper, spotless, checkLicense]
#                    → build
#                    → dockerBuildTest (docker-build-test.yml: build + goss-test)
#                    → dockerPublish   (docker-publish.yml: push `develop` image + sign)
#
#   pull_request:    [testScope, gradleWrapper, spotless, checkLicense]
#                  → [build, verifySourceMetadata, unitTests, integrationTests, referenceTests, referenceTestsEvmV2,
#                     devnetTests, devnetTestsEvmV2, acceptanceTests]
#                  → dockerBuildTest (docker-build-test.yml: build + goss-test; dockerPublish skipped - not on main)
#                  → allTestsPassed (PR merge gate; needs build, the suites and dockerBuildTest).
#
#   workflow_dispatch with checks=full: as pull_request (full CI).
#   workflow_dispatch with checks=fast, pull_request to rebase/**: as pull_request, with only build and
#                  unitTests (fast checks): verifySourceMetadata, the other suites and dockerBuildTest
#                  are skipped, and allTestsPassed requires build and unitTests.
#
#   testScope selects between them: none (push to main), fast or full.

jobs:
  testScope:
    name: "Test scope"
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Select the test suites to run
        id: scope
        env:
          SCOPE: >-
            ${{
              ((github.event_name == 'workflow_dispatch' && inputs.checks != 'fast')
                || (github.event_name == 'pull_request' && !startsWith(github.base_ref, 'rebase/')))
              && 'full'
              || ((github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
                  && 'fast' || 'none')
            }}
        run: echo "scope=$SCOPE" | tee -a "$GITHUB_OUTPUT"

  checkNoBinaries:
    name: "No binaries check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check for binary files
        run: |
          binaries=$(git ls-files -z | xargs -0 file | awk -F': ' 'tolower($2) ~ /elf|mach-o|pe32|ms-dos|compiled/' || true)
          extensions=$(git ls-files | grep -iE '\.(exe|dll|so|dylib|class|pyc)$' || true)
          if [ -n "$binaries" ] || [ -n "$extensions" ]; then
            echo "Binary files found:"
            [ -n "$binaries" ] && echo "$binaries"
            [ -n "$extensions" ] && echo "$extensions"
            exit 1
          fi
      # CI steps glob and shell out over checked-out paths.
      - name: Check for unsafe file names
        run: |
          unsafe=$(git ls-files | LC_ALL=C grep -vE '^[A-Za-z0-9._/-]+$' || true)
          reports=$(git ls-files | grep -E '(^|/)TEST-.*\.xml$' || true)
          if [ -n "$unsafe" ] || [ -n "$reports" ]; then
            echo "Unsafe or unexpected file names found:"
            [ -n "$unsafe" ] && echo "$unsafe"
            [ -n "$reports" ] && echo "$reports"
            exit 1
          fi

  gradleWrapper:
    name: "Gradle Wrapper Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1

  spotless:
    name: "Spotless"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: run spotless
        run: ./gradlew spotlessCheck

  checkLicense:
    name: "Check License"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: run checkLicense
        run: ./gradlew --no-parallel checkLicense # no-parallel due to https://github.com/jk1/Gradle-License-Report/issues/337
      - name: upload license report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: checkLicense
          path: build/reports/dependency-license

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [spotless, checkLicense, gradleWrapper, checkNoBinaries]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Gradle Build
        run: ./gradlew build -x test -x spotlessCheck
      - name: Upload plugin API compatibility report
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: plugin-api-compatibility-report
          path: plugin-api/build/reports/japicmp/
          if-no-files-found: ignore
      - name: Upload tar.gz
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: besu-tar
          path: build/distributions/besu-*.tar.gz
      - name: Upload zip
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: besu-zip
          path: build/distributions/besu-*.zip
      - name: Upload workspace build
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: assemble-output
          path: |
            ./
            !./.git/**
          retention-days: 1
          include-hidden-files: 'true'

  # Supply chain security: verifies that source JARs for all dependencies are recorded
  # in verification-metadata.xml. Prevents tampered or undeclared source artifacts
  # from being introduced without explicit sign-off.
  verifySourceMetadata:
    name: "Verify Dependency Source Metadata"
    if: needs.testScope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    needs: [testScope, spotless, checkLicense, gradleWrapper, checkNoBinaries]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Verify source artifacts recorded in verification-metadata.xml
        run: ./gradlew verifySourceArtifacts

  # Tests
  # Each suite has its suite-tests-passed job in the file directly
  unitTests:
    if: needs.testScope.outputs.scope != 'none'
    needs: [testScope, spotless, checkLicense, gradleWrapper, checkNoBinaries]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/unit-tests.yml

  integrationTests:
    if: needs.testScope.outputs.scope == 'full'
    needs: [testScope, spotless, checkLicense, gradleWrapper, checkNoBinaries]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/integration-tests.yml

  referenceTests:
    if: needs.testScope.outputs.scope == 'full'
    needs: [testScope, spotless, checkLicense, gradleWrapper, checkNoBinaries]
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/reference-tests.yml

  # EVM v2 is behind the experimental --Xevm-v2 flag; these keep it in consensus with EVM v1.
  referenceTestsEvmV2:
    if: needs.testScope.outputs.scope == 'full'
    needs: [testScope, spotless, checkLicense, gradleWrapper, checkNoBinaries]
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/reference-tests.yml
    with:
      evm_v2: true

  devnetTests:
    if: needs.testScope.outputs.scope == 'full'
    needs: [testScope, spotless, checkLicense, gradleWrapper, checkNoBinaries]
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/devnet-tests.yml

  devnetTestsEvmV2:
    if: needs.testScope.outputs.scope == 'full'
    needs: [testScope, spotless, checkLicense, gradleWrapper, checkNoBinaries]
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/devnet-tests.yml
    with:
      evm_v2: true

  acceptanceTests:
    if: needs.testScope.outputs.scope == 'full'
    needs: [testScope, spotless, checkLicense, gradleWrapper, checkNoBinaries]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/acceptance-tests.yml

  # not part of the fast checks
  dockerBuildTest:
    needs: [testScope, build]
    if: needs.testScope.outputs.scope != 'fast'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/docker-build-test.yml
    with:
      assemble_run_id: ${{ github.run_id }}

  # only fires on merge to main, so 'develop' is kept up to date
  dockerPublish:
    needs: [build, dockerBuildTest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: develop
    secrets: inherit

  allTestsPassed:
    name: allTestsPassed
    runs-on: ubuntu-latest
    needs: [testScope, build, verifySourceMetadata, unitTests, integrationTests, referenceTests, referenceTestsEvmV2, devnetTests, devnetTestsEvmV2, acceptanceTests, dockerBuildTest]
    if: always() && needs.testScope.outputs.scope != 'none'
    steps:
      # fast checks skip every suite but unitTests, so build and unitTests must have run
      - name: Fail on workflow error
        run: exit 1
        if: >-
          ${{
            contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
            || (needs.testScope.outputs.scope == 'full' && contains(needs.*.result, 'skipped'))
            || needs.build.result != 'success'
            || needs.unitTests.result != 'success'
          }}
