# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

on:
  workflow_dispatch:
  schedule:
    # * is a special character in YAML so you have to quote this string
    # expression evaluates to midnight every night
    - cron: '0 0 * * *'

jobs:
  # Scheduled runs skip analysis when nothing compiled has changed since the
  # last successful scan, to avoid rescanning an unchanged tree.
  changes:
    name: Check for changes
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      scan: ${{ steps.check.outputs.scan }}
    steps:
    - id: check
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
        SHA: ${{ github.sha }}
      run: |
        # Manual dispatch always scans (e.g. to pick up new CodeQL queries).
        if [ "$EVENT" != "schedule" ]; then
          echo "scan=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        if ! last=$(gh run list -R "$REPO" -w codeql.yml -b main -s success -L 1 --json headSha --jq '.[0].headSha // ""'); then
          echo "Could not look up previous CodeQL runs; scanning."
          echo "scan=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        if [ -z "$last" ]; then
          echo "No previous successful scan found; scanning."
          echo "scan=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        if [ "$last" = "$SHA" ]; then
          echo "Last successful scan was at $SHA; skipping."
          echo "scan=false" >> "$GITHUB_OUTPUT"; exit 0
        fi
        # Compare lists at most 300 files; treat a truncated or failed compare as changed.
        # Include a rename's previous path so moving a source out of the build counts.
        if ! files=$(gh api "repos/$REPO/compare/$last...$SHA" --jq '.files[] | .filename, (.previous_filename // empty)'); then
          echo "Could not compare $last...$SHA; scanning."
          echo "scan=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        if [ "$(printf '%s\n' "$files" | grep -c .)" -ge 300 ] || \
           printf '%s\n' "$files" | grep -qE '\.(java|kt|kts|gradle|sol)$|^gradle/|^gradle\.properties$|^\.github/workflows/codeql\.yml$'; then
          echo "Source or build changes since $last; scanning."
          echo "scan=true" >> "$GITHUB_OUTPUT"
        else
          echo "No source or build changes since $last; skipping."
          echo "scan=false" >> "$GITHUB_OUTPUT"
        fi

  analyze:
    name: Analyze
    needs: changes
    if: needs.changes.outputs.scan == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['java']  # Add other languages as needed: 'javascript', 'python', etc.
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Set up Java
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        distribution: 'temurin'
        java-version: 25
    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@0e9f55954318745b37b7933c693bc093f7336125 # v4.35.1
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        queries: security-and-quality,security-extended

    - name: setup gradle
      uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
    # CodeQL only extracts sources javac actually compiles; outputs restored
    # from the build cache would be missing from the database.
    - name: compileJava noscan
      run: |
        JAVA_OPTS="-Xmx2048M" ./gradlew --no-scan --no-build-cache compileJava
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@0e9f55954318745b37b7933c693bc093f7336125 # v4.35.1
