name: Hive
on:
  # TEMPORARY, to test this workflow on its PR: remove before merging.
  pull_request:
    paths:
      - '.github/workflows/hive.yml'
  workflow_dispatch:
    inputs:
      simulator:
        description: 'Hive simulator. rpc-compat takes a few minutes; consensus and engine take an hour or more, so give a sim_limit.'
        required: true
        default: 'ethereum/rpc-compat'
        type: choice
        # The simulators at the default hive_ref
        options:
          - ethereum/rpc-compat
          - ethereum/consensus
          - ethereum/engine
          - ethereum/sync
          - ethereum/graphql
          - devp2p
          - ethereum/eels/consume-engine
          - ethereum/eels/consume-rlp
          - ethereum/eels/consume-sync
          - ethereum/eels/consume-enginex
          - ethereum/eels/execute-blobs
      sim_limit:
        description: 'Hive --sim.limit: "<suite regex>/<test regex>". Go simulators (consensus, engine) match unanchored; pytest-based ones (eest/consume-*) need a leading ".*". Blank runs the whole simulator.'
        required: false
        type: string
      sim_parallelism:
        description: 'Hive --sim.parallelism'
        required: false
        default: '4'
        type: string
      besu_ref:
        required: true
        type: string
        default: main
        description: Branch to test
      besu_repo:
        required: false
        type: string
        description: 'Custom git repository to checkout branch from. Expected format: owner/repo (e.g., besu-eth/besu)'
      hive_ref:
        required: false
        type: string
        description: 'ethereum/hive commit to run. Blank uses the pinned default.'

env:
  GRADLE_OPTS: "-Xmx6g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
  BESU_REF: ${{ inputs.besu_ref || 'main' }}
  BESU_REPO: ${{ inputs.besu_repo || github.repository }}
  # ethereum/hive master at 2026-10-22. Update deliberately: simulator behaviour changes with it.
  HIVE_REF: ${{ inputs.hive_ref || 'e1ad81006c63555915e05a121df3e68953fa9138' }}
  SIMULATOR: ${{ inputs.simulator || 'ethereum/rpc-compat' }}
  SIM_LIMIT: ${{ inputs.sim_limit }}
  SIM_PARALLELISM: ${{ inputs.sim_parallelism || '4' }}

jobs:
  hive:
    name: "Hive (${{ inputs.simulator || 'ethereum/rpc-compat' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Log what is being tested
        run: |
          {
            echo "### Hive target"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Repository | $BESU_REPO |"
            echo "| Ref (branch/commit) | $BESU_REF |"
            echo "| Simulator | $SIMULATOR |"
            echo "| --sim.limit | ${SIM_LIMIT:-(all)} |"
            echo "| --sim.parallelism | $SIM_PARALLELISM |"
            echo "| Hive commit | $HIVE_REF |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout Besu
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.BESU_REF }}
          repository: ${{ env.BESU_REPO }}
          path: besu
          persist-credentials: false
      - name: Checkout Hive
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ethereum/hive
          ref: ${{ env.HIVE_REF }}
          path: hive
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
        env:
          # Restore the build job's entry, not an older one saved by this job
          GRADLE_BUILD_ACTION_CACHE_KEY_JOB: build
        with:
          cache-read-only: true # only the build job in ci.yml writes the Gradle cache
      - name: Build Besu docker image
        working-directory: besu
        run: |
          # Without the pyroscope agent: its download from GitHub often fails, and hive does not use it.
          ./gradlew :distDockerCopy
          sed -i '/^ADD .*pyroscope\.jar/d' build/docker-besu/Dockerfile
          ./gradlew :distDocker -x :distDockerCopy
          tag=$(docker images hyperledger/besu --format '{{.Tag}}' | head -1)
          echo "Built hyperledger/besu:$tag"
          printf -- '- client: besu\n  nametag: besu-local\n  build_args:\n    baseimage: hyperledger/besu\n    tag: %s\n' "$tag" \
            > ../hive/client-config.yaml
      - name: Build Hive
        working-directory: hive
        # The runner's Go downloads the toolchain hive's go.mod asks for, checked against the Go
        # checksum database. actions/setup-go is not on this repository's allowed actions list.
        run: |
          go build .
          go version
      - name: Run Hive
        id: hive
        working-directory: hive
        run: |
          args=(--sim "$SIMULATOR" --client besu --client-file client-config.yaml
            --client.checktimelimit 180s --sim.parallelism "$SIM_PARALLELISM")
          if [ -n "$SIM_LIMIT" ]; then
            args+=(--sim.limit "$SIM_LIMIT")
          fi
          # hive exits non-zero when a test fails; summarise first, fail the job at the end.
          status=0
          ./hive "${args[@]}" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          df -h / | tail -1
      - name: Summarise results
        id: summary
        if: always()
        working-directory: hive
        run: |
          # One results file per suite; hive.json is hive's own metadata.
          shopt -s nullglob
          results=(workspace/logs/[0-9]*.json)
          if [ ${#results[@]} -eq 0 ]; then
            echo "No hive results were written." >> "$GITHUB_STEP_SUMMARY"
            echo "failed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - "${results[@]}" <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import html, json, os, sys

          # Failures listed by name, and the hive log of the first few, which holds the
          # request, the response and how it differs from what the test expects.
          MAX_NAMES, MAX_DETAILS, MAX_LINES, MAX_LINE_LENGTH = 200, 20, 40, 300

          def details(suite_dir, suite, case):
              log = case["summaryResult"].get("log")
              path = os.path.join(suite_dir, suite.get("testDetailsLog") or "")
              if not log or not os.path.isfile(path):
                  return case["summaryResult"].get("details", "")
              with open(path, "rb") as f:
                  f.seek(log["begin"])
                  return f.read(log["end"] - log["begin"]).decode(errors="replace")

          total_failed = 0
          print("### Hive results\n")
          for path in sys.argv[1:]:
              with open(path) as f:
                  suite = json.load(f)
              cases = suite.get("testCases", {}).values()
              failed = sorted((c for c in cases if not c["summaryResult"]["pass"]), key=lambda c: c["name"])
              total_failed += len(failed)
              print(f"**{suite.get('name')}**: {len(cases) - len(failed)} passed, {len(failed)} failed\n")
              for case in failed[:MAX_NAMES]:
                  print(f"- {case['name']}")
              if len(failed) > MAX_NAMES:
                  print(f"- … and {len(failed) - MAX_NAMES} more, see the hive-results artifact")
              print()
              for case in failed[:MAX_DETAILS]:
                  lines = details(os.path.dirname(path), suite, case).strip().splitlines()
                  shown = [l if len(l) <= MAX_LINE_LENGTH else l[:MAX_LINE_LENGTH] + " …" for l in lines[:MAX_LINES]]
                  if len(lines) > MAX_LINES:
                      shown.append(f"… {len(lines) - MAX_LINES} more lines in the hive-results artifact")
                  print(f"<details><summary>{html.escape(case['name'])}</summary>\n\n````\n" + "\n".join(shown) + "\n````\n</details>\n")
              if len(failed) > MAX_DETAILS:
                  print(f"Details of the other {len(failed) - MAX_DETAILS} failures are in the hive-results artifact.\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"failed={total_failed}", file=out)
          EOF
      - name: Upload Hive results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hive-results
          path: hive/workspace/logs
          retention-days: 7
      - name: Fail if hive failed
        if: steps.hive.outputs.status != '0'
        env:
          HIVE_STATUS: ${{ steps.hive.outputs.status }}
          FAILED: ${{ steps.summary.outputs.failed }}
        run: |
          # hive also exits non-zero when it fails itself, such as on a build error or a
          # client that does not start, often before it writes any results.
          if [ "${FAILED:-0}" -gt 0 ]; then
            echo "::error::$FAILED hive tests failed, see the job summary"
          else
            echo "::error::Hive exited with status $HIVE_STATUS without a failed test, see the Run Hive step"
          fi
          exit 1
