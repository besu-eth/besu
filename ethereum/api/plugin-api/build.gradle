apply plugin: 'java-library'

// override the path-derived name (besu-ethereum-api-plugin-api) with the plugin API family naming
def rpcApiArtifactId = 'besu-plugin-api-rpc'

jar {
  archiveBaseName = rpcApiArtifactId
  manifest {
    attributes(
      'Specification-Title': archiveBaseName,
      'Specification-Version': project.version,
      'Implementation-Title': archiveBaseName,
      'Implementation-Version': calculateVersion(),
      'Commit-Hash': getGitCommitDetails(40).hash,
      'Automatic-Module-Name': 'org.hyperledger.besu.plugin.api.rpc'
      )
  }
}

dependencies {
  api project(':plugin-api:core')
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      groupId = 'org.hyperledger.besu'
      artifactId = rpcApiArtifactId
      pom {
        name = 'Besu Plugin API Rpc'
        description = 'RPC endpoint and health check contracts of the Besu plugin API, letting plugins register custom JSON-RPC methods, call the enabled RPC methods of the node directly without going through HTTP, and provide liveness and readiness checks'
      }
    }
  }
}
