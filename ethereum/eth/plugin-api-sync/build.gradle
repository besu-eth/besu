apply plugin: 'java-library'

// override the path-derived name (besu-ethereum-eth-plugin-api-sync) with the plugin API family naming
def syncApiArtifactId = 'besu-plugin-api-sync'

jar {
  archiveBaseName = syncApiArtifactId
  manifest {
    attributes(
      'Specification-Title': archiveBaseName,
      'Specification-Version': project.version,
      'Implementation-Title': archiveBaseName,
      'Implementation-Version': calculateVersion(),
      'Commit-Hash': getGitCommitDetails(40).hash,
      'Automatic-Module-Name': 'org.hyperledger.besu.plugin.api.sync'
      )
  }
}

dependencies {
  api project(':plugin-api:core')
  // Hash appears in this module's own signatures, so the dependency is declared
  // here even though plugin-api:core also re-exports it
  api project(':datatypes')
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      groupId = 'org.hyperledger.besu'
      artifactId = syncApiArtifactId
      pom {
        name = 'Besu Plugin API Sync'
        description = 'Synchronization contracts of the Besu plugin API, letting plugins control the synchronizer and chain head and query sync status'
      }
    }
  }
}
