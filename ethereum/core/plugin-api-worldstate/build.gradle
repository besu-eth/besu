apply plugin: 'java-library'

// override the path-derived name (besu-ethereum-core-plugin-api-worldstate) with the plugin API family naming
def worldstateApiArtifactId = 'besu-plugin-api-worldstate'

jar {
  archiveBaseName = worldstateApiArtifactId
  manifest {
    attributes(
      'Specification-Title': archiveBaseName,
      'Specification-Version': project.version,
      'Implementation-Title': archiveBaseName,
      'Implementation-Version': calculateVersion(),
      'Commit-Hash': getGitCommitDetails(40).hash,
      'Automatic-Module-Name': 'org.hyperledger.besu.plugin.api.worldstate'
      )
  }
}

dependencies {
  api project(':plugin-api:core')
  // AccountValue, Address, Hash and StorageSlotKey appear in this module's own
  // signatures, so the dependency is declared here even though plugin-api:core
  // also re-exports it
  api project(':datatypes')
  // WorldStateService returns evm.worldstate.WorldView from both of its methods;
  // this is the module's only evm edge
  api project(':evm')
  // Bytes and UInt256 appear in the trie-log contract signatures
  api 'io.consensys.tuweni:tuweni-bytes'
  api 'io.consensys.tuweni:tuweni-units'
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      groupId = 'org.hyperledger.besu'
      artifactId = worldstateApiArtifactId
      pom {
        name = 'Besu Plugin API Worldstate'
        description = 'World state observation contracts of the Besu plugin API, letting plugins read world state and observe trie log changes'
      }
    }
  }
}
