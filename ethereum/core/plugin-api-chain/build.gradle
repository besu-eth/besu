apply plugin: 'java-library'

// override the path-derived name (besu-ethereum-core-plugin-api-chain) with the plugin API family naming
def chainApiArtifactId = 'besu-plugin-api-chain'

jar {
  archiveBaseName = chainApiArtifactId
  manifest {
    attributes(
      'Specification-Title': archiveBaseName,
      'Specification-Version': project.version,
      'Implementation-Title': archiveBaseName,
      'Implementation-Version': calculateVersion(),
      'Commit-Hash': getGitCommitDetails(40).hash,
      'Automatic-Module-Name': 'org.hyperledger.besu.plugin.api.chain'
      )
  }
}

dependencies {
  api project(':plugin-api:core')
  // Hash, Wei, Transaction, HardforkId, Address and LogTopic appear in this module's own
  // signatures, so the dependency is declared here even though plugin-api:core re-exports it
  api project(':datatypes')
  // Bytes is in RlpConverterService and LogWithMetadata, UInt256 in PropagatedBlockContext
  api 'io.consensys.tuweni:tuweni-bytes'
  api 'io.consensys.tuweni:tuweni-units'
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      groupId = 'org.hyperledger.besu'
      artifactId = chainApiArtifactId
      pom {
        name = 'Besu Plugin API Chain'
        description = 'Blockchain contracts of the Besu plugin API: the blockchain service for chain queries and chain markers, the RLP conversion service, and the block, log and bad-block data views'
      }
    }
  }
}
