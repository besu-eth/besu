<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 1090 244" width="1090" height="244" role="img" aria-label="Thread timeline of the example block on the optimistic processor with same-sender chains and balance carry-over: the runs start as block processing starts on tx 0, so block processing executes tx 0 itself, J's transactions run as one chain, a late chain runs tx 5 on tx 4's result once their sender is recovered but ends after block processing executed tx 5, tx 3's deposit is carried onto the WETH balance tx 2 left, and block processing executes 7 of 13 transactions itself."><style>svg{--surface:#ffffff;--ink:#14171c;--ink-2:#4a5160;--ink-3:#6f7685;--rule:#d8dce2;--lane:#eef0f3;--c-run:#2a78d6;--on-run:#ffffff;--c-refresh:#1baf7a;--on-refresh:#0b2219;--c-exec:#eb6834;--on-exec:#2a1206;--neutral:#c9ced6;--on-neutral:#14171c;--flag-bad:#fbd9ca;--flag-ok:#c9efe0;}@media (prefers-color-scheme: dark){svg{--surface:#151820;--ink:#e7e9ee;--ink-2:#b4bac6;--ink-3:#8a91a0;--rule:#2a2f39;--lane:#1b1f27;--c-run:#3987e5;--on-run:#08111f;--c-refresh:#199e70;--on-refresh:#04140d;--c-exec:#d95926;--on-exec:#1a0802;--neutral:#3a404c;--on-neutral:#e7e9ee;--flag-bad:#4a2416;--flag-ok:#11392b;}}
text{font-family:"IBM Plex Sans Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif}
.bg{fill:var(--surface)}
.lane{fill:var(--lane)}.lane-ghost{fill:none;stroke:var(--rule);stroke-dasharray:3 3}
.t-lane,.t-head,.t-tag,.t-card-title,.t-card-op,.t-card-slot,.t-card-val{font-family:"IBM Plex Mono",SFMono-Regular,Menlo,Consolas,monospace}
.t-lane{font-size:10px;fill:var(--ink-2)}.t-lane-main{font-size:12px;font-weight:600;fill:var(--ink)}
.t-bar{font-size:9.5px;font-weight:600}.t-carry{font-size:12px;font-weight:600}.t-num{font-size:10px;font-weight:600;fill:var(--ink-2)}
.t-axis,.t-done,.t-done-prev{font-size:10.5px;fill:var(--ink-2)}.t-done{font-weight:600;fill:var(--ink)}
.t-arrow{font-size:10.5px;font-weight:500;fill:var(--ink-2);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.t-head{font-size:10px;letter-spacing:.05em;text-transform:uppercase;fill:var(--ink-3)}.t-tag{font-size:10.5px;fill:var(--ink-2)}
.t-stage{font-size:12.5px;font-weight:600;fill:var(--ink)}.t-cell{font-size:10.5px;font-weight:600}
.b-run{fill:var(--c-run)}.b-refresh{fill:var(--c-refresh)}.b-exec{fill:var(--c-exec)}.b-neutral,.b-fail{fill:var(--neutral)}.b-side{fill:var(--neutral);opacity:.75}
.b-wasted{stroke:var(--ink-3);stroke-width:1}.b-rejected{stroke:var(--c-refresh);stroke-width:1.2}
.b-ghost{fill:none;stroke:var(--c-refresh);stroke-width:1.4;stroke-dasharray:4 3}.b-wait{fill:var(--surface);stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 2.5}
.hatch-bg{fill:var(--surface)}.hatch-line{stroke:var(--ink-3);stroke-width:1.5}.hatch-line-r{stroke:var(--c-refresh);stroke-width:1.6}.hatch-line-w{stroke:var(--surface);stroke-width:1.4;opacity:.85}
.on-run{fill:var(--on-run)}.on-refresh{fill:var(--on-refresh)}.on-exec{fill:var(--on-exec)}.on-neutral{fill:var(--on-neutral)}.on-lane{fill:var(--ink)}
.done{stroke:var(--ink);stroke-width:1.5}.done-prev{stroke:var(--ink-3);stroke-width:1.2;stroke-dasharray:4 3}
.arrow{fill:none;stroke:var(--ink-2);stroke-width:1.3}.arrowhead{fill:var(--ink-2)}
.callout circle{fill:var(--ink);stroke:var(--surface);stroke-width:2}.callout text{fill:var(--surface);font-size:10px;font-weight:600}
.ladder-row{fill:transparent}.changed{fill:none;stroke:var(--ink);stroke-width:1.6}.done-bar{fill:var(--ink-3)}
.card{fill:var(--surface);stroke:var(--rule);stroke-width:1.2}.t-card-title{font-size:11.5px;font-weight:500;fill:var(--ink)}
.t-card-op{font-size:11px;fill:var(--ink-3)}.t-card-slot{font-size:11px;fill:var(--ink)}.t-card-val{font-size:11px;font-weight:500;fill:var(--ink)}
.t-card-foot{font-size:11px;fill:var(--ink-2)}.t-flag{font-size:10px;font-weight:600;fill:var(--ink)}.flag-bad{fill:var(--flag-bad)}.flag-ok{fill:var(--flag-ok)}.t-note{font-size:12px;fill:var(--ink-2)}</style><rect x="-14" y="-14" width="1090" height="244" rx="8" class="bg"/><defs>
