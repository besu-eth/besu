</defs><rect x="120" y="33" width="872.0" height="26" class="lane"/><text x="114" y="49.8" text-anchor="end" class="t-lane-main">block processing</text><rect x="120" y="73" width="872.0" height="17" class="lane"/><text x="114" y="85.3" text-anchor="end" class="t-lane">worker 1</text><rect x="120" y="91" width="872.0" height="17" class="lane"/><text x="114" y="103.3" text-anchor="end" class="t-lane">worker 2</text><rect x="120" y="109" width="872.0" height="17" class="lane"/><text x="114" y="121.3" text-anchor="end" class="t-lane">worker 3</text><rect x="120" y="127" width="872.0" height="17" class="lane"/><text x="114" y="139.3" text-anchor="end" class="t-lane">worker 4</text><rect x="120" y="145" width="872.0" height="17" class="lane"/><text x="114" y="157.3" text-anchor="end" class="t-lane">worker 5</text><rect x="120" y="163" width="872.0" height="17" class="lane"/><text x="114" y="175.3" text-anchor="end" class="t-lane">worker 6</text><g><title>tx 0, swap, pool P: speculative run on the parent state, thrown away</title><rect x="160" y="74" width="60.0" height="15" rx="2.5" class="b-wasted" fill="url(#tl-chains-11809-h)"/><text x="190.0" y="85.1" class="t-bar on-lane" text-anchor="middle">0</text></g><g><title>tx 1, ETH transfer to I: speculative run on the parent state</title><rect x="160" y="92" width="24.0" height="15" rx="2.5" class="b-run"/><text x="172.0" y="103.1" class="t-bar on-run" text-anchor="middle">1</text></g><g><title>tx 2, WETH deposit: speculative run on the parent state</title><rect x="160" y="110" width="36.0" height="15" rx="2.5" class="b-run"/><text x="178.0" y="121.1" class="t-bar on-run" text-anchor="middle">2</text></g><g><title>tx 3, WETH deposit: speculative run on the parent state</title><rect x="160" y="128" width="36.0" height="15" rx="2.5" class="b-run"/><text x="178.0" y="139.1" class="t-bar on-run" text-anchor="middle">3</text></g><g><title>tx 4, swap, pool Q: speculative run on the parent state</title><rect x="160" y="146" width="60.0" height="15" rx="2.5" class="b-run"/><text x="190.0" y="157.1" class="t-bar on-run" text-anchor="middle">4</text></g><g><title>tx 5, USDC transfer: run alone on the parent state, fails the nonce check</title><rect x="160" y="164" width="7.5" height="15" rx="2.5" class="b-fail"/></g><g><title>tx 6, batch call, 8.6 Mgas: speculative run on the parent state, thrown away</title><rect x="167.5" y="164" width="360.0" height="15" rx="2.5" class="b-wasted" fill="url(#tl-chains-11809-h)"/><text x="347.5" y="175.1" class="t-bar on-lane" text-anchor="middle">6 thrown away</text></g><g><title>tx 7, swap, pool P: speculative run on the parent state</title><rect x="184" y="92" width="60.0" height="15" rx="2.5" class="b-run"/><text x="214.0" y="103.1" class="t-bar on-run" text-anchor="middle">7</text></g><g><title>tx 8, approve token X: speculative run on the parent state</title><rect x="196" y="110" width="24.0" height="15" rx="2.5" class="b-run"/><text x="208.0" y="121.1" class="t-bar on-run" text-anchor="middle">8</text></g><g><title>tx 9, swap X, pool R: chained run on tx 8's state</title><rect x="220" y="110" width="54.0" height="15" rx="2.5" class="b-run"/><text x="247.0" y="121.1" class="t-bar on-run" text-anchor="middle">9 on 8</text></g><g><title>tx 10, swap, pool S: speculative run on the parent state</title><rect x="196" y="128" width="60.0" height="15" rx="2.5" class="b-run"/><text x="226.0" y="139.1" class="t-bar on-run" text-anchor="middle">10</text></g><g><title>tx 11, swap, pool P: speculative run on the parent state</title><rect x="220" y="74" width="60.0" height="15" rx="2.5" class="b-run"/><text x="250.0" y="85.1" class="t-bar on-run" text-anchor="middle">11</text></g><g><title>Recovers the senders the mempool never saw</title><rect x="220" y="146" width="18.0" height="15" rx="2.5" class="b-neutral"/></g><g><title>tx 12, swap, pool S: speculative run on the parent state</title><rect x="238" y="146" width="60.0" height="15" rx="2.5" class="b-run"/><text x="268.0" y="157.1" class="t-bar on-run" text-anchor="middle">12</text></g><g><title>tx 5, USDC transfer: late chain on the result of tx 4's run, once their sender is recovered, thrown away</title><rect x="244" y="92" width="27.0" height="15" rx="2.5" class="b-wasted" fill="url(#tl-chains-11809-h)"/><text x="257.5" y="103.1" class="t-bar on-lane" text-anchor="middle">5</text></g><g><title>Start of the block: system calls and setup</title><rect x="124" y="34" width="36.0" height="24" rx="2.5" class="b-neutral"/><text x="142.0" y="49.6" class="t-bar on-neutral" text-anchor="middle">start</text></g><g><title>tx 0, swap, pool P: block processing executes it itself, its run has not finished</title><rect x="160" y="34" width="51.0" height="24" rx="2.5" class="b-exec"/></g><g><title>tx 1, ETH transfer to I: takes the speculative result</title><rect x="211" y="34" width="12.0" height="24" rx="2" class="b-run"/></g><g><title>tx 2, WETH deposit: takes the speculative result</title><rect x="223" y="34" width="12.0" height="24" rx="2" class="b-run"/></g><g><title>tx 3, WETH deposit: takes the speculative result, carrying the WETH balance</title><rect x="235" y="34" width="12.0" height="24" rx="2" class="b-run"/><text x="241.0" y="50.0" text-anchor="middle" class="t-carry on-run">+</text></g><g><title>tx 4, swap, pool Q: takes the speculative result</title><rect x="247" y="34" width="12.0" height="24" rx="2" class="b-run"/></g><g><title>tx 5, USDC transfer: block processing executes it itself, its late chain has not finished</title><rect x="259" y="34" width="25.5" height="24" rx="2.5" class="b-exec"/></g><g><title>tx 6, batch call, 8.6 Mgas: block processing executes it itself, its run has not finished</title><rect x="284.5" y="34" width="300.0" height="24" rx="2.5" class="b-exec"/></g><g><title>tx 7, swap, pool P: block processing executes it itself, tx 0 changed pool P</title><rect x="584.5" y="34" width="51.0" height="24" rx="2.5" class="b-exec"/></g><g><title>tx 8, approve token X: takes the chained result</title><rect x="635.5" y="34" width="12.0" height="24" rx="2" class="b-run"/></g><g><title>tx 9, swap X, pool R: takes the chained result</title><rect x="647.5" y="34" width="12.0" height="24" rx="2" class="b-run"/></g><g><title>tx 10, swap, pool S: block processing executes it itself, tx 1 raised its sender's balance</title><rect x="659.5" y="34" width="51.0" height="24" rx="2.5" class="b-exec"/></g><g><title>tx 11, swap, pool P: block processing executes it itself, pool P changed</title><rect x="710.5" y="34" width="51.0" height="24" rx="2.5" class="b-exec"/></g><g><title>tx 12, swap, pool S: block processing executes it itself, tx 10 changed pool S</title><rect x="761.5" y="34" width="51.0" height="24" rx="2.5" class="b-exec"/></g><g><title>Receipts root of the block</title><rect x="812.5" y="34" width="36.0" height="24" rx="2.5" class="b-neutral"/></g><g><title>State root and persist</title><rect x="848.5" y="34" width="72.0" height="24" rx="2.5" class="b-neutral"/><text x="884.5" y="49.6" class="t-bar on-neutral" text-anchor="middle">state root</text></g><text x="185.5" y="29" text-anchor="middle" class="t-num">0</text><text x="217.0" y="29" text-anchor="middle" class="t-num">1</text><text x="229.0" y="29" text-anchor="middle" class="t-num">2</text><text x="241.0" y="29" text-anchor="middle" class="t-num">3</text><text x="253.0" y="29" text-anchor="middle" class="t-num">4</text><text x="271.8" y="29" text-anchor="middle" class="t-num">5</text><text x="434.5" y="29" text-anchor="middle" class="t-num">6</text><text x="610.0" y="29" text-anchor="middle" class="t-num">7</text><text x="641.5" y="29" text-anchor="middle" class="t-num">8</text><text x="653.5" y="29" text-anchor="middle" class="t-num">9</text><text x="685.0" y="29" text-anchor="middle" class="t-num">10</text><text x="736.0" y="29" text-anchor="middle" class="t-num">11</text><text x="787.0" y="29" text-anchor="middle" class="t-num">12</text><line x1="959.5" y1="32" x2="959.5" y2="196" class="done-prev"/><text x="963.5" y="208" class="t-done-prev">without chains</text><line x1="920.5" y1="32" x2="920.5" y2="184" class="done"/><text x="916.5" y="194" text-anchor="end" class="t-done">block done</text><text x="120" y="194" class="t-axis">time →</text><path d="M220,153.5 C238.0,153.5 226.0,99.5 243,99.5" class="arrow" marker-end="url(#tl-chains-11809-a)"/><g class="callout"><circle cx="185.5" cy="66" r="7.2"/><text x="185.5" y="69.6" text-anchor="middle">1</text></g><g class="callout"><circle cx="284.0" cy="117.5" r="7.2"/><text x="284.0" y="121.1" text-anchor="middle">2</text></g><g class="callout"><circle cx="166.0" cy="162" r="7.2"/><text x="166.0" y="165.6" text-anchor="middle">3</text></g><g class="callout"><circle cx="281.0" cy="99.5" r="7.2"/><text x="281.0" y="103.1" text-anchor="middle">4</text></g><g class="callout"><circle cx="241.0" cy="66" r="7.2"/><text x="241.0" y="69.6" text-anchor="middle">5</text></g><g class="callout"><circle cx="434.5" cy="66" r="7.2"/><text x="434.5" y="69.6" text-anchor="middle">6</text></g><g class="callout"><circle cx="610.0" cy="66" r="7.2"/><text x="610.0" y="69.6" text-anchor="middle">7</text></g></svg>
