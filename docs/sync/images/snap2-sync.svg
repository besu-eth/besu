<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 1090 374" width="1090" height="374" role="img" aria-label="Schematic timeline of the example SNAP2 sync: the state download at pivot 1,000, one pivot move to 1,032, the header download, then the slot merge, the catch-up to 1,056, the storage trie updates and the final build with the window, and after the sync the RocksDB merges and the back-fill."><style>svg{--surface:#ffffff;--ink:#14171c;--ink-2:#4a5160;--ink-3:#6f7685;--rule:#d8dce2;--lane:#eef0f3;--c-run:#2a78d6;--on-run:#ffffff;--c-refresh:#1baf7a;--on-refresh:#0b2219;--c-exec:#eb6834;--on-exec:#2a1206;--neutral:#c9ced6;--on-neutral:#14171c;}@media (prefers-color-scheme: dark){svg{--surface:#151820;--ink:#e7e9ee;--ink-2:#b4bac6;--ink-3:#8a91a0;--rule:#2a2f39;--lane:#1b1f27;--c-run:#3987e5;--on-run:#08111f;--c-refresh:#199e70;--on-refresh:#04140d;--c-exec:#d95926;--on-exec:#1a0802;--neutral:#3a404c;--on-neutral:#e7e9ee;}}
text{font-family:"IBM Plex Sans Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif}
.bg{fill:var(--surface)}.lane{fill:var(--lane)}
.t-lane-main{font-size:12px;font-weight:600;fill:var(--ink)}
.t-lane{font-size:10px;fill:var(--ink-2);font-family:"IBM Plex Mono",SFMono-Regular,Menlo,Consolas,monospace}
.t-bar{font-size:10px;font-weight:600}.t-side{font-size:10.5px;fill:var(--ink-2)}
.t-mark{font-size:10.5px;font-weight:600;fill:var(--ink)}.t-pivot{font-size:10.5px;font-weight:600;fill:var(--ink)}
.t-head{font-size:10px;letter-spacing:.05em;text-transform:uppercase;fill:var(--ink-3)}
.b-run{fill:var(--c-run)}.b-refresh{fill:var(--c-refresh)}.b-exec{fill:var(--c-exec)}.b-neutral{fill:var(--neutral)}
.on-run{fill:var(--on-run)}.on-refresh{fill:var(--on-refresh)}.on-exec{fill:var(--on-exec)}.on-neutral{fill:var(--on-neutral)}
.mark{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:4 3}.pivot{fill:var(--ink)}</style><rect class="bg" x="-14" y="-14" width="1090" height="374"/><text class="t-head" x="0" y="8">part of the sync</text><text class="t-head" x="196" y="8">time, schematic</text><rect class="lane" x="196" y="46" width="864" height="24" rx="3"/><text class="t-lane-main" x="0" y="62">pivot</text><rect class="lane" x="196" y="80" width="864" height="24" rx="3"/><text class="t-lane-main" x="0" y="91">state download</text><text class="t-lane" x="0" y="102">snap2-state, -persist</text><rect class="lane" x="196" y="114" width="864" height="24" rx="3"/><text class="t-lane-main" x="0" y="125">pivot moves</text><text class="t-lane" x="0" y="136">snap2-worker</text><rect class="lane" x="196" y="148" width="864" height="24" rx="3"/><text class="t-lane-main" x="0" y="159">storage tries</text><text class="t-lane" x="0" y="170">snap2-storage-trie</text><rect class="lane" x="196" y="182" width="864" height="24" rx="3"/><text class="t-lane-main" x="0" y="193">headers</text><text class="t-lane" x="0" y="204">snap2-sync (headers)</text><rect class="lane" x="196" y="216" width="864" height="24" rx="3"/><text class="t-lane-main" x="0" y="227">window</text><text class="t-lane" x="0" y="238">snap2-window</text><rect class="lane" x="196" y="250" width="864" height="24" rx="3"/><text class="t-lane-main" x="0" y="261">final build</text><text class="t-lane" x="0" y="272">snap2-trie-builder</text><rect class="lane" x="196" y="284" width="864" height="24" rx="3"/><text class="t-lane-main" x="0" y="295">RocksDB</text><text class="t-lane" x="0" y="306">background jobs</text><rect class="lane" x="196" y="318" width="864" height="24" rx="3"/><text class="t-lane-main" x="0" y="329">back-fill</text><text class="t-lane" x="0" y="340">snap2-backfill</text><line class="mark" x1="688.5" y1="24" x2="688.5" y2="342"/><text class="t-mark" x="692.5" y="32">state downloaded</text><line class="mark" x1="908.8" y1="24" x2="908.8" y2="342"/><text class="t-mark" x="912.8" y="32">sync complete</text><circle class="pivot" cx="204.6" cy="58.0" r="4"/><text class="t-pivot" x="212.6" y="62.0">1,000</text><circle class="pivot" cx="494.1" cy="58.0" r="4"/><text class="t-pivot" x="502.1" y="62.0">1,032</text><circle class="pivot" cx="744.6" cy="58.0" r="4"/><text class="t-pivot" x="752.6" y="62.0">1,056</text><rect class="b-run" x="204.6" y="83" width="267.8" height="18" rx="2"/><text class="t-bar on-run" x="210.6" y="96">accounts, storages, bytecodes at 1,000</text><rect class="b-run" x="494.1" y="83" width="194.4" height="18" rx="2"/><text class="t-bar on-run" x="500.1" y="96">the rest, at 1,032</text><rect class="b-exec" x="472.5" y="117" width="21.6" height="18" rx="2"/><rect class="b-exec" x="723.0" y="117" width="21.6" height="18" rx="2"/><rect class="b-refresh" x="744.6" y="151" width="25.9" height="18" rx="2"/><rect class="b-run" x="204.6" y="185" width="337.0" height="18" rx="2"/><text class="t-bar on-run" x="210.6" y="198">999 down to the floor</text><rect class="b-run" x="744.6" y="219" width="73.4" height="18" rx="2"/><text class="t-bar on-run" x="750.6" y="232">929 to 1,056</text><rect class="b-refresh" x="770.6" y="253" width="133.9" height="18" rx="2"/><text class="t-bar on-refresh" x="776.6" y="266">256 partitions, root check</text><rect class="b-neutral" x="688.5" y="287" width="34.6" height="18" rx="2"/><rect class="b-neutral" x="913.1" y="287" width="146.9" height="18" rx="2"/><text class="t-bar on-neutral" x="919.1" y="300">trie level 0, small files</text><rect class="b-run" x="913.1" y="321" width="146.9" height="18" rx="2"/><text class="t-bar on-run" x="919.1" y="334">from 928 down</text><text class="t-side" x="459.5" y="130" text-anchor="end">1,001 to 1,032</text><text class="t-side" x="757.6" y="130" text-anchor="start">catch-up, 1,033 to 1,056</text><text class="t-side" x="783.5" y="164" text-anchor="start">C&#x27;s and F&#x27;s tries</text><text class="t-side" x="675.5" y="300" text-anchor="end">slot level 0</text></svg>
